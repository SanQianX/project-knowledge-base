  function jobDetail(id){const j=data.jobs.find(j=>j.id===id);if(!j)return;openDialog(j.title,`<p>${esc(projectName(j.project))} · ${jobLabel(j)}</p><div class="p-body-text">${esc(j.reason)}</div><p>已尝试 ${j.attempts} 次${j.kind==='index'?' · 只恢复索引阶段':''}</p>${j.state==='recovering'?`<p data-countdown="${j.id}"></p>`:''}`,`<button data-action="close-dialog">关闭</button>${j.state==='blocked'?'<button class="p-primary" data-action="settings">去配置</button>':j.state==='failed'?`<button class="p-primary" data-action="retry-job" data-id="${id}">重新尝试</button>`:''}`);dialogContext={job:id};updateCountdowns();}

  function attach(gid,pid){if(!group(gid)||!project(pid)||project(pid).archived)return;const ids=data.bindings[pid]||=[];if(ids.includes(gid)){notify('这个项目已经使用该组合。');return;}ids.push(gid);log('添加组合“'+group(gid).name+'”',pid);changed('已应用到 '+projectName(pid));}
  function detach(gid,pid){const before=[...(data.bindings[pid]||[])];data.bindings[pid]=before.filter(id=>id!==gid);log('移除组合“'+(group(gid)?.name||'')+'”的项目关联',pid);changed('已解除关联，其他项目不变。',()=>{data.bindings[pid]=before;changed('已恢复关联。');});}
  function retryJob(id){const j=data.jobs.find(j=>j.id===id);if(!j||j.state==='recovering'||j.state==='completed')return;j.state='recovering';j.due=now()+2500;j.reason=j.kind==='index'?'正在补建索引，已保存的知识保持不变。':'已经进入恢复队列，继续同一项任务。';closeDialog();log('任务进入恢复队列：'+j.title,j.project);changed('正在恢复，无需重复点击。');}

  function tick(){let any=false;for(const j of data.jobs){if(j.state==='recovering'&&j.due<=now()){j.state='completed';j.attempts++;j.reason=j.kind==='index'?'索引已恢复，没有重复运行分析。':'维护已完成，已继续处理后续提交。';delete j.due;log('自动恢复成功：'+j.title,j.project);any=true;}}if(any){const opened=dialogContext?.job;persist();render();if(opened&&$('[data-dialog]').open)jobDetail(opened);}updateCountdowns();}
  function patchProject(id,patch){const fresh=data.newProjects.find(p=>p.id===id);if(fresh)Object.assign(fresh,patch);else data.projectEdits[id]={...data.projectEdits[id],...patch};}
  function addExisting(id){const g=group(id);if(!g)return;openDialog('选入已有记忆',`<div class="p-tools"><input data-input="existing-query" placeholder="查找已有记忆" aria-label="查找已有记忆"></div><div data-existing-list></div><div data-existing-pager></div><p data-existing-count></p>`,`<button type="button" data-action="close-dialog">取消</button><button class="p-primary" type="submit">加入组合</button>`,'existing-save');dialogContext={existing:id,selected:new Set(),query:'',page:0};renderExisting();}
  function renderExisting(){const c=dialogContext,g=group(c?.existing);if(!g)return;const rows=data.memories.filter(m=>m.status==='confirmed'&&!g.ids.includes(m.id)&&`${m.title} ${m.body}`.toLowerCase().includes(c.query.toLowerCase()));c.page=Math.min(c.page,Math.max(0,Math.ceil(rows.length/6)-1));$('[data-existing-list]').innerHTML=rows.slice(c.page*6,(c.page+1)*6).map(m=>`<label class="p-check"><input type="checkbox" data-change="existing-check" value="${m.id}" ${c.selected.has(m.id)?'checked':''}><span>${esc(m.title)}<small style="display:block">${esc(m.body.slice(0,65))}</small></span></label>`).join('')||empty('没有匹配的已有记忆。');$('[data-existing-pager]').innerHTML=pager(c.page,rows.length,6,'existingPage');$('[data-existing-count]').textContent=`已选择 ${c.selected.size} 条，加入“${g.name}”后共享原内容。`;}
  root.addEventListener('click',event=>{

    const action=b.dataset.action,id=b.dataset.id,pid=b.dataset.project;if(!action)return;event.preventDefault();

      case 'memory-groups':memoryGroups(id);break;
      case 'add-existing':addExisting(id);break;
      case 'review':review(id);break;
      case 'ignore-candidate':{const m=mem(id);if(!m)break;m.status='ignored';closeDialog();log('忽略候选记忆“'+m.title+'”');changed('已忽略候选。',()=>{m.status='candidate';changed('已恢复候选。');});break;}
      case 'delete-memory':{const m=mem(id);if(!m)break;const oldStatus=m.status,relations=data.groups.filter(g=>g.ids.includes(id)).map(g=>g.id);confirm('删除这条记忆？','“'+m.title+'”将从所有组合中移除。其他小记忆保留。',()=>{m.status='deleted';data.groups.forEach(g=>g.ids=g.ids.filter(x=>x!==id));log('删除记忆“'+m.title+'”');changed('已删除记忆。',()=>{m.status=oldStatus;relations.forEach(gid=>{const g=group(gid);if(g&&!g.ids.includes(id))g.ids.push(id);});changed('已恢复记忆。');});});break;}
      case 'delete-group':{const g=group(id);if(!g)break;const copy=structuredClone(g),relations=linked(id).map(p=>p.id);confirm('删除组合？','“'+g.name+'”将解除 '+relations.length+' 个项目的关联。里面的小记忆仍保留在“全部记忆”中。',()=>{data.groups=data.groups.filter(x=>x.id!==id);Object.keys(data.bindings).forEach(key=>data.bindings[key]=data.bindings[key].filter(x=>x!==id));ui.group='all';log('删除组合“'+g.name+'”，保留小记忆');changed('组合已删除，小记忆保留。',()=>{data.groups.push(copy);relations.forEach(key=>{const ids=data.bindings[key]||=[];if(!ids.includes(id))ids.push(id);});changed('已恢复组合。');});});break;}

      case 'edit-project':projectEditor(id);break;
      case 'project-groups':projectGroups(id);break;

      case 'remove-project':{const p=project(id);if(!p)break;confirm('移除项目？','从列表移除“'+p.name+'”。组合、记忆和知识内容保留，不删除任何真实文件。',()=>{patchProject(id,{archived:true});ui.project=null;log('移除项目',id);changed('已从列表移除项目。',()=>{patchProject(id,{archived:false});changed('已恢复项目。');});});break;}
      case 'domains':domainsDialog();break;
      case 'rename-domain':{const d=data.domains.find(d=>d.id===id);if(d)openDialog('重命名领域',`<input type="hidden" name="id" value="${id}"><label>领域名称<input name="name" required maxlength="40" value="${esc(d.name)}"></label>`,'<button type="button" data-action="close-dialog">取消</button><button class="p-primary" type="submit">保存</button>','domain-rename');break;}

  root.addEventListener('submit',event=>{
    const f=event.target,key=f.dataset.form;if(!key)return;event.preventDefault();const v=name=>f.elements[name]?.value?.trim()||'';let id=v('id');
    if(key==='search'){ui.searchQuery=v('query');ui.searchProject=v('project');ui.searchType=v('type');ui.searchDone=true;ui.searchPage=0;render();return;}
    if(key==='memory-save'){
      const title=v('title'),body=f.elements.body.value.trim();if(!title||!body){error('请填写标题和记忆内容。');return;}let m=mem(id);if(m){m.title=title;m.body=body;m.updated=now();log('编辑记忆“'+title+'”');}else{const gid=v('group');if(gid&&!group(gid)){error('组合已不存在，请重新选择。');return;}m={id:uid('m'),title,body,status:'confirmed',source:'手动添加',updated:now()};data.memories.push(m);if(gid)group(gid).ids.push(m.id);ui.memoryPage=0;log('添加记忆“'+title+'”');}closeDialog();changed('记忆已保存，多行内容保持在同一条记忆中。');return;
    }
    if(key==='group-save'){const name=v('name');if(!name){error('请填写组合名称。');return;}if(data.groups.some(g=>g.id!==id&&g.name.toLowerCase()===name.toLowerCase())){error('已经有同名组合。');return;}const g=group(id);if(g){g.name=name;log('重命名组合为“'+name+'”');}else{const fresh={id:uid('g'),name,ids:[]};data.groups.push(fresh);ui.route='memory';ui.memoryTab='library';ui.group=fresh.id;ui.memoryPage=0;log('创建组合“'+name+'”');}closeDialog();changed('组合已保存。');return;}
    if(key==='memory-groups-save'){const m=mem(id);if(!m)return;const chosen=new Set([...f.querySelectorAll('[name=groups]:checked')].map(x=>x.value));data.groups.forEach(g=>{g.ids=g.ids.filter(x=>x!==id);if(chosen.has(g.id))g.ids.push(id);});closeDialog();log('调整记忆“'+m.title+'”的组合归属');changed('组合归属已更新，仍共享同一条记忆。');return;}
    if(key==='project-groups-save'){if(!project(id))return;data.bindings[id]=[...f.querySelectorAll('[name=groups]:checked')].map(x=>x.value).filter(group);closeDialog();log('调整项目的记忆组合',id);changed('已保存项目组合。');return;}
    if(key==='apply-projects-save'){const c=dialogContext,g=group(c?.group);if(!c?.selected||!g)return;for(const p of activeProjects()){const ids=(data.bindings[p.id]||[]).filter(x=>x!==g.id);if(c.selected.has(p.id))ids.push(g.id);data.bindings[p.id]=ids;}const count=c.selected.size;closeDialog();log('调整组合“'+g.name+'”的 '+count+' 个项目引用');changed('应用范围已保存。');return;}
    if(key==='existing-save'){const c=dialogContext,g=group(c?.existing);if(!g)return;const chosen=[...c.selected].filter(id=>mem(id)?.status==='confirmed');g.ids=[...new Set([...g.ids,...chosen])];closeDialog();log('选入 '+chosen.length+' 条记忆到“'+g.name+'”');changed('已加入组合，没有复制记忆内容。');return;}
    if(key==='review-save'){const m=mem(id),gid=v('group');if(!m)return;if(gid&&!group(gid)){error('请重新选择组合。');return;}m.status='confirmed';m.updated=now();if(gid&&!group(gid).ids.includes(id))group(gid).ids.push(id);closeDialog();log('确认候选记忆“'+m.title+'”');changed(gid?'已确认并加入“'+group(gid).name+'”。':'已确认，保留在未归组合的记忆中。');return;}
    if(key==='project-save'){const name=v('name'),path=v('path'),knowledge=v('knowledge'),domain=v('domain');if(!name||!path||!knowledge){error('请填写项目名称和两个目录。');return;}const duplicate=projects().find(p=>p.id!==id&&p.path.toLowerCase()===path.toLowerCase());if(duplicate&&!duplicate.archived){error('这个代码目录已经登记。');return;}if(id){patchProject(id,{name,path,knowledge,domain});log('更新项目设置',id);}else if(duplicate){id=duplicate.id;patchProject(id,{name,path,knowledge,domain,archived:false});log('重新登记项目',id);}else{id=uid('project');data.newProjects.push({id,name,path,knowledge,domain,archived:false});data.bindings[id]=[];log('导入项目',id);}ui.route='projects';ui.project=id;closeDialog();changed('项目已登记，未读取或修改真实目录。');return;}

    if(key==='settings-save'){const oldProfile=data.settings.profile;data.settings={theme:v('theme'),profile:v('profile')};if(data.settings.profile==='available'){for(const j of data.jobs.filter(j=>j.state==='blocked')){j.state='recovering';j.due=now()+2500;j.reason='模型配置已恢复，任务自动继续。';}}closeDialog();log('保存外观和示例维护配置');changed(data.settings.profile==='available'&&oldProfile!=='available'?'配置已更新，暂停任务会自动恢复。':'设置已保存。');return;}

    if(key==='memory-query'){ui.memoryQuery=el.value;ui.memoryPage=0;render();}
    if(key==='project-query'){ui.projectQuery=el.value;ui.projectPage=0;render();}
    if(key==='apply-project-query'&&dialogContext?.selected){dialogContext.query=el.value;dialogContext.page=0;renderApplyProjects();}
    if(key==='existing-query'&&dialogContext?.existing){dialogContext.query=el.value;dialogContext.page=0;renderExisting();}
  });
  root.addEventListener('change',event=>{
    const el=event.target,key=el.dataset.change;
    if(el.closest('[data-form="search"]')){if(el.name==='project')ui.searchProjectDraft=el.value;if(el.name==='type')ui.searchTypeDraft=el.value;}
    if(key==='project-domain'){ui.domain=el.value;ui.projectPage=0;render();}
    if(key==='apply-project-check'&&dialogContext?.selected){if(el.checked)dialogContext.selected.add(el.value);else dialogContext.selected.delete(el.value);$('[data-apply-count]').textContent=`已选择 ${dialogContext.selected.size} 个项目，翻页后继续保留选择。`;}
    if(key==='existing-check'&&dialogContext?.selected){if(el.checked)dialogContext.selected.add(el.value);else dialogContext.selected.delete(el.value);$('[data-existing-count]').textContent=`已选择 ${dialogContext.selected.size} 条记忆。`;}
    if(key==='review-group'){const g=group(el.value);$('[data-review-impact]').textContent=g?`加入后，使用“${g.name}”的 ${linked(g.id).length} 个项目后续新任务会读到它。`:'确认后保留在记忆库，加入组合并应用到项目后生效。';}
  });
  root.addEventListener('dragstart',event=>{const tagNode=event.target.closest('[data-drag-tag]'),groupNode=event.target.closest('[data-drag-group]');if(!tagNode&&!groupNode)return;drag=tagNode?{group:tagNode.dataset.dragTag,project:tagNode.dataset.project}:{group:groupNode.dataset.dragGroup};event.dataTransfer.effectAllowed='copyMove';event.dataTransfer.setData('text/plain',JSON.stringify(drag));const label=$('[data-drag-label]');if(label)label.textContent=drag.project?'把项目标签拖回这里可移除':'拖动组合到项目';});
  root.addEventListener('dragover',event=>{const target=event.target.closest('[data-drop-project],[data-unlink-drop]');if(!drag||!target)return;event.preventDefault();event.dataTransfer.dropEffect=target.hasAttribute('data-unlink-drop')?'move':'copy';target.classList.add('p-over');});
  root.addEventListener('dragleave',event=>{const target=event.target.closest('[data-drop-project],[data-unlink-drop]');if(target&&!target.contains(event.relatedTarget))target.classList.remove('p-over');});
  root.addEventListener('drop',event=>{const target=event.target.closest('[data-drop-project],[data-unlink-drop]');if(!drag||!target)return;event.preventDefault();if(target.dataset.dropProject)attach(drag.group,target.dataset.dropProject);else if(drag.project)detach(drag.group,drag.project);drag=null;root.querySelectorAll('.p-over').forEach(n=>n.classList.remove('p-over'));});
  root.addEventListener('dragend',()=>{drag=null;root.querySelectorAll('.p-over').forEach(n=>n.classList.remove('p-over'));const label=$('[data-drag-label]');if(label)label.textContent='拖动组合到项目';});
  window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(s?.kind===STORE&&valid(s.data)&&s.data.revision!==lastSavedRevision&&s.data.revision>data.revision){data=s.data;closeDialog();render();}});
  render();const ticker=setInterval(tick,1000);window.addEventListener('beforeunload',()=>clearInterval(ticker));
})();
</script>
