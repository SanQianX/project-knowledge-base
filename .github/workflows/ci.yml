name: Non-release validation

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: non-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - run: npm test -- --no-report
        env:
          # Step-level runner.temp: outside the checkout, so the knowledge
          # lane fixtures never have to fall back to a temp root that lives
          # inside the repository.
          PK_TEST_TEMP_ROOT: ${{ runner.temp }}
      - run: npm pack --dry-run --json

  core-windows:
    name: Core (web runtime) / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Runner TEMP uses 8.3 short paths (RUNNER~1); realpathSync.native expands
      # them, breaking path-equality assertions. Use a workspace-local temp dir.
      TEMP: ${{ github.workspace }}\.tmp
      TMP: ${{ github.workspace }}\.tmp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Prepare temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .tmp | Out-Null
      - name: Install and test web runtime
        shell: pwsh
        env:
          # Step-level runner.temp: a full-length path outside the checkout.
          # The job-level TEMP/TMP stay on workspace\.tmp for the existing
          # tests; the knowledge lane fixtures need a temp root that is
          # outside the repository, so they read this variable first.
          PK_TEST_TEMP_ROOT: ${{ runner.temp }}
          # The startup harness uses a separate, explicit isolation root.
          KB_PREFLIGHT_ISO_ROOT: ${{ runner.temp }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --no-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/test/slow-startup-runtime-test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/test/slow-startup-cli-test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack --dry-run --json

  qa-controller:
    name: QA controller / Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Run QA controller tests
        run: npm test --prefix qa-autopilot
        env:
          # Fixtures and temp bare repos must stay outside the checkout;
          # os.tmpdir() follows TMPDIR/TMP/TEMP.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - name: Test exact candidate publishing guards
        run: node --test qa-autopilot/tools/stable-next-prepare-test.cjs qa-autopilot/tools/stable-next-publish-test.cjs qa-autopilot/tools/stable-next-workflow-test.cjs

  qa-controller-windows:
    name: QA controller / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Run QA controller tests
        run: npm test --prefix qa-autopilot
        env:
          # Step-level runner.temp: full-length path (no RUNNER~1 8.3 short
          # form), outside the workspace; no job-level runner expressions.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Test exact candidate publishing guards
        run: node --test qa-autopilot/tools/stable-next-prepare-test.cjs qa-autopilot/tools/stable-next-publish-test.cjs qa-autopilot/tools/stable-next-workflow-test.cjs
