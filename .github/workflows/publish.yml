# .github/workflows/publish.yml: automatic tag publishing remains RC-only.
# RC_ONLY_DURING_QA: stable candidates use the manual next-only route below.
#
# Four manual modes exist under one workflow file, and they are selected by
# the "mode" dispatch input (default: auth-probe):
#
#   auth-probe       - ASSESSMENT ONLY. Asks npm whether the EXISTING GitHub
#                      identity of this workflow file is already a trusted
#                      publisher for the selected package. It never publishes,
#                      never moves a dist-tag, never changes npm access and
#                      never creates or broadens trust.
#   stable-prepare   - builds ONE reviewed candidate tarball from ONE reviewed
#                      commit and records an immutable receipt. It never
#                      publishes and never touches the registry.
#   stable-publish-next
#                    - publishes EXACTLY the artifact that an earlier
#                      successful stable-prepare run produced, to the "next"
#                      tag only. It never rebuilds, never moves "latest" and
#                      never prepares anything.
#   stable-promote  - moves "latest" to the version that is ALREADY published
#                      under "next" and that a human accepted from an official
#                      download/install/UI/restart. It never publishes a
#                      version, never moves "next" and never touches another
#                      package.
#
# The three stable modes are separate manual runs on purpose: the candidate must
# be downloaded and independently reviewed BEFORE it can be published, so the
# publish route takes the prepare run id plus the reviewed sha256/SRI from the
# caller and never derives them from the artifact it is about to publish. The
# promotion route runs only after the acceptance of the published candidate.
name: Publish reviewed QA candidate
on:
  push:
    tags:
      - 'qa-rc/*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual mode of this workflow file'
        required: true
        type: choice
        default: 'auth-probe'
        options:
          - 'auth-probe'
          - 'stable-prepare'
          - 'stable-publish-next'
          - 'stable-promote'
      package:
        description: 'npm package whose existing trusted-publisher identity is probed'
        required: true
        type: choice
        options:
          # The core package: the only publication target of this workflow.
          - '@sanqianx/project-knowledge'
          # The optional desktop package: assessment and core-only guards only.
          - '@sanqianx/project-knowledge-desktop'
          # Assessment only: module packages whose npm-side publisher binding is
          # being located. They are NEVER published here; the stable
          # prepare/publish route below refuses them with PACKAGE_NAME.
          - '@sanqianx/claude-ai-workbench'
          - '@sanqianx/ai-coding-event-bridge-console'
      source_sha:
        description: 'stable modes only: exact 40-hex reviewed commit to build from'
        required: false
        type: string
      expected_version:
        description: 'stable modes only: exact expected version (x.y.z)'
        required: false
        type: string
      prepare_run_id:
        description: 'stable-publish-next only: run id of the successful prepare run'
        required: false
        type: string
      expected_tarball_sha256:
        description: 'stable-publish-next only: reviewed tarball sha256 (64 hex)'
        required: false
        type: string
      expected_tarball_sri:
        description: 'stable-publish-next and stable-promote only: reviewed tarball integrity (sha512-...)'
        required: false
        type: string
      expected_current_latest:
        description: 'stable-promote only: the latest version observed at review time (x.y.z)'
        required: false
        type: string
      acceptance_ack:
        description: 'stable-promote only: the official acceptance attestation phrase'
        required: false
        type: string
      reviewer:
        description: 'stable-publish-next and stable-promote only: identity of the reviewer'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: npm-project-knowledge-rc
  cancel-in-progress: false
jobs:
  publish:
    # The RC path stays exactly as it was; the manual dispatch route never
    # reaches this job.
    if: github.repository == 'SanQianX/project-knowledge-base' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Configure protected reviewers and matching npm OIDC identity FIRST.
    environment: npm-rc-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Verify candidate identity before lifecycle scripts
        run: node qa-autopilot/tools/ci-rc-guard.cjs pre
      - run: npm ci
      - run: npm run release:verify
      - run: npm test -- --no-report
      - name: Select reviewed npm major and record actual version
        run: npm install -g npm@11 && npm --version
      - name: Pack once and inspect exact artifact
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/qa-rc"
          npm pack --json --pack-destination "$RUNNER_TEMP/qa-rc" > "$RUNNER_TEMP/qa-rc/pack.json"
          node qa-autopilot/tools/ci-rc-guard.cjs pack "$RUNNER_TEMP/qa-rc/pack.json"
      - name: Publish only next using the inspected tarball
        run: npm publish "${{ steps.package.outputs.tarball }}" --tag next --access public --provenance
      - name: Verify immutable registry receipt and unchanged latest
        run: node qa-autopilot/tools/ci-rc-guard.cjs post "$RUNNER_TEMP/qa-rc/pack.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-rc-receipt
          path: ${{ runner.temp }}/qa-rc
          if-no-files-found: warn
  auth-probe:
    # Assessment only. The job asks npm ONE question through the documented
    # OIDC token exchange: is the identity of this workflow file already
    # authorized to publish the selected package?
    # It deliberately has NO environment claim (so it matches a connection
    # registered without an environment, like the historical core one), NO
    # registry-url and NO NODE_AUTH_TOKEN placeholder, and it never writes an
    # npm credential file. The short-lived registry token stays in the
    # probe's memory and never reaches stdout, a log or the receipt.
    if: github.repository == 'SanQianX/project-knowledge-base' && github.event_name == 'workflow_dispatch' && inputs.mode == 'auth-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-auth-probe
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Probe the existing npm trusted-publisher identity
        env:
          PROBE_PACKAGE: ${{ inputs.package }}
        run: node qa-autopilot/tools/npm-oidc-auth-probe.cjs --package "$PROBE_PACKAGE" --receipt "$RUNNER_TEMP/npm-oidc-auth-probe/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-oidc-auth-probe-receipt
          path: ${{ runner.temp }}/npm-oidc-auth-probe/receipt.json
          if-no-files-found: warn
  stable-prepare:
    # Phase 1 of 2. Builds ONE candidate tarball from ONE reviewed commit in a
    # clean tracked checkout and records an immutable receipt next to it.
    # It NEVER publishes, never touches the registry and never moves a tag.
    # It has NO id-token permission and NO environment claim, so it cannot
    # obtain a publishing identity even by accident.
    if: github.repository == 'SanQianX/project-knowledge-base' && github.event_name == 'workflow_dispatch' && inputs.mode == 'stable-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: npm-stable-prepare
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate the manual source commit input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node -e "if(!/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA||'')){console.error('source_sha must be a 40-hex commit id');process.exit(1);}"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Restore the reviewed lockfile exactly
        run: npm ci
      - name: Verify the reviewed version lockstep
        run: node _site/scripts/sync-release-version.js --check --web-only
      - name: Verify the vendored runtime integrity
        run: node _site/scripts/verify-module-runtime.js
      - name: Build the reviewed candidate and write its receipt
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa-autopilot/tools/stable-next-prepare.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-next-candidate
          path: ${{ runner.temp }}/stable-next
          if-no-files-found: error
          retention-days: 30
  stable-publish-next:
    # Phase 2 of 2. Publishes EXACTLY the artifact that an earlier successful
    # stable-prepare run produced, to the "next" tag only. It never rebuilds
    # and never prepares. "latest" is never moved and no other dist-tag is
    # touched. With no NPM_PUBLISH_TOKEN secret the job keeps the original
    # OIDC trusted-publisher identity; when that optional granular token is
    # set, only the publish step writes a temporary userconfig holding the
    # npm placeholder (never the token itself) and removes it on exit.
    if: github.repository == 'SanQianX/project-knowledge-base' && github.event_name == 'workflow_dispatch' && inputs.mode == 'stable-publish-next'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: npm-stable-publish-next
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Select the npm major that supports trusted publishing
        run: npm install -g npm@11 && npm --version
      - name: Verify the prepare run belongs to this repository and workflow
        id: prepare
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA256: ${{ inputs.expected_tarball_sha256 }}
          EXPECTED_SRI: ${{ inputs.expected_tarball_sri }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          REVIEWER: ${{ inputs.reviewer }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa-autopilot/tools/stable-next-publish.cjs verify-run
      - name: Download the reviewed candidate from the prepare run
        uses: actions/download-artifact@v4
        with:
          name: stable-next-candidate
          run-id: ${{ steps.prepare.outputs.prepare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/stable-next-candidate
      - name: Publish the reviewed bytes to next only
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA256: ${{ inputs.expected_tarball_sha256 }}
          EXPECTED_SRI: ${{ inputs.expected_tarball_sri }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          REVIEWER: ${{ inputs.reviewer }}
          ARTIFACT_DIR: ${{ runner.temp }}/stable-next-candidate
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional granular write token; absent -> the original OIDC path.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            export NPM_CONFIG_USERCONFIG="$(mktemp)"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
            trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          fi
          node qa-autopilot/tools/stable-next-publish.cjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-next-publication
          path: ${{ runner.temp }}/stable-next
          if-no-files-found: warn
          retention-days: 30
  stable-promote:
    # Phase 3 of 3, and the FINAL phase of the stable procedure: the candidate
    # is published under "next", a human accepted it from an OFFICIAL
    # download/install/UI/restart, and only now may "latest" move.
    # This job never publishes a version, never moves "next", never removes a
    # dist-tag and never touches a package other than the core one. The
    # dispatch package choice is checked by the core-only guard.
    # The write is the npm CLI itself, so the npm side "Allow npm dist-tag"
    # grant is exercised exactly as npm would exercise it. A successful
    # publish proves nothing about that grant: it stays unproven until this
    # route performs a real authorized write.
    # Authentication mirrors stable-publish-next: no NPM_PUBLISH_TOKEN
    # secret keeps the original OIDC dist-tag write; the optional token is
    # consumed only by the promote step via a temporary userconfig holding
    # the npm placeholder, never by the check step or any other job.
    # The acceptance phrase is the reviewer's own attestation. It is not
    # machine proof, and the tool records it as such.
    if: github.repository == 'SanQianX/project-knowledge-base' && github.event_name == 'workflow_dispatch' && inputs.mode == 'stable-promote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: npm-stable-promote
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Verify the reviewed source identity and version
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          node -e 'if (require("./package.json").version !== process.env.EXPECTED_VERSION) throw new Error("Reviewed source version differs from promotion target")'
      - name: Select the npm version that can use OIDC for a dist-tag write
        run: npm install -g npm@11.21.1 && npm --version
      - name: Verify every promotion precondition without writing
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SRI: ${{ inputs.expected_tarball_sri }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_CURRENT_LATEST: ${{ inputs.expected_current_latest }}
          ACCEPTANCE_ACK: ${{ inputs.acceptance_ack }}
          REVIEWER: ${{ inputs.reviewer }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa-autopilot/tools/stable-promote.cjs check
      - name: Promote the accepted version to latest
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SRI: ${{ inputs.expected_tarball_sri }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_CURRENT_LATEST: ${{ inputs.expected_current_latest }}
          ACCEPTANCE_ACK: ${{ inputs.acceptance_ack }}
          REVIEWER: ${{ inputs.reviewer }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
          # Optional granular write token; absent -> the original OIDC path.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            export NPM_CONFIG_USERCONFIG="$(mktemp)"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
            trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          fi
          node qa-autopilot/tools/stable-promote.cjs promote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-promotion
          path: ${{ runner.temp }}/stable-promotion
          if-no-files-found: warn
          retention-days: 30
