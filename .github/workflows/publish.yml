name: Publish to npm
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    if: github.repository == 'SanQianX/project-knowledge-base'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:verify
      - run: node _site/scripts/sync-release-version.js --check --tag "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm pack --dry-run
      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1; no NODE_AUTH_TOKEN —
      # with a token present the CLI falls back to it and hits the 2FA wall.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
