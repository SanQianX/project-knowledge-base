name: Publish to npm
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    if: github.repository == 'SanQianX/project-knowledge-base'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          # No registry-url: it writes an empty _authToken placeholder to
          # ~/.npmrc, which suppresses the CLI's OIDC auto-detection and sends
          # an invalid token instead. The public npm registry is the default.
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:verify
      - run: node _site/scripts/sync-release-version.js --check --tag "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm pack --dry-run
      # Trusted publishing (OIDC) needs npm 11.5+; npm 12 dropped
      # --auth-type=oidc (falls back to interactive web login) and shows no
      # auto-detection, so pin the 11 series. No NODE_AUTH_TOKEN — with a
      # token present the CLI falls back to it and hits the 2FA wall.
      - run: npm install -g npm@11
      # Exchange the GitHub OIDC identity for a short-lived npm session; this
      # is what actually matches the trusted publisher configured on npmjs.com.
      - run: npm --version && npm login --auth-type=oidc
      - run: npm publish --provenance --access public
        id: direct-publish
        continue-on-error: true
      # Staged publish is always allowed for trusted publishers; the version
      # goes live once a maintainer approves it on npmjs.com (2FA).
      - run: npm stage publish
        if: steps.direct-publish.outcome == 'failure'
