name: Publish to npm
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    if: github.repository == 'SanQianX/project-knowledge-base'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          # No registry-url: it writes an empty _authToken placeholder to
          # ~/.npmrc, which suppresses the CLI's OIDC auto-detection and sends
          # an invalid token instead. The public npm registry is the default.
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:verify
      - run: node _site/scripts/sync-release-version.js --check --tag "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm pack --dry-run
      # Trusted publishing (OIDC): npm's auto flow needs npm 11.5+ (npm 12
      # dropped --auth-type=oidc and shows no working flow). All OIDC failures
      # are swallowed silently by design — verbose logging surfaces the
      # token-exchange error that names the actual mismatch.
      - run: npm install -g npm@11
      - run: npm publish --provenance --access public --loglevel verbose
